name: Deploy Frontend (Angular)

# Despliega la aplicacion Angular en la instancia EC2 Frontend via SSH a traves del bastion.
# Tambien actualiza DuckDNS y activa HTTPS con certbot si aun no esta activado.
# Secrets requeridos en GitHub:
#   SSH_PRIVATE_KEY      — Clave privada PEM del Key Pair de AWS (sin passphrase)
#   DUCKDNS_TOKEN        — Token de DuckDNS (en duckdns.org -> tu cuenta)
#   CERTBOT_EMAIL        — Email para Let's Encrypt (p.ej. tu@gmail.com)
# Variables de repositorio (se rellenan automaticamente por terraform.yml):
#   BASTION_EIP, FRONTEND_PRIVATE_IP, FRONTEND_EIP, BACKEND_PRIVATE_IP

on:
  push:
    branches: [Front]
    paths:
      - 'frontend/src/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/angular.json'
      - 'Terraform_tfg/frontend.sh'
      - '.github/workflows/deploy_frontend.yml'
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Angular via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Actualizar DuckDNS
        continue-on-error: true
        run: |
          RESP=$(curl -s --max-time 15 "https://www.duckdns.org/update?domains=bookshell&token=${{ secrets.DUCKDNS_TOKEN }}&ip=${{ vars.FRONTEND_EIP }}" || echo "CURL_ERROR")
          echo "Respuesta DuckDNS: $RESP"
          if [ "$RESP" != "OK" ]; then
            echo "::warning::DuckDNS no devolvio OK — comprueba el token y la IP"
          fi

      - name: Pull, build y HTTPS (via bastion)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.FRONTEND_PRIVATE_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ vars.BASTION_EIP }}
          proxy_username: ubuntu
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            BACKEND_IP="${{ vars.BACKEND_PRIVATE_IP }}"

            # ── Instalar Node.js / git / Apache si no estan (instancia nueva) ─
            NODE_VER=$(node -v 2>/dev/null | cut -dv -f2 | cut -d. -f1 || echo "0")
            if ! command -v node &> /dev/null || [ "$NODE_VER" -lt 18 ] 2>/dev/null; then
              echo "==> Node.js no encontrado — instalando Node 20 LTS..."
              export DEBIAN_FRONTEND=noninteractive
              sudo apt-get update -y -q
              sudo apt-get install -y -q curl git apache2 certbot python3-certbot-apache
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y -q nodejs
              sudo a2enmod rewrite proxy proxy_http
              sudo systemctl enable apache2
            fi

            # ── Clonar o actualizar repo ──────────────────────────────────
            if [ ! -d "/var/www/front/.git" ]; then
              echo "==> Clonando repositorio..."
              sudo rm -rf /var/www/front
              sudo git clone -b Front --single-branch \
                https://github.com/ftoledo-26/bookshell.git /var/www/front
            else
              cd /var/www/front
              sudo git fetch origin Front
              sudo git reset --hard origin/Front
            fi

            # ── Build Angular ─────────────────────────────────────────────
            cd /var/www/front/frontend
            sudo npm install
            sudo npm run build -- --configuration production

            # ── Copiar build al DocumentRoot ──────────────────────────────
            sudo rm -rf /var/www/html/*
            DIST_DIR=$(sudo find /var/www/front/frontend/dist -name "index.html" -exec dirname {} \; | head -1)
            sudo cp -r "$DIST_DIR"/* /var/www/html/

            # ── .htaccess para Angular routing ────────────────────────────
            {
              echo 'Options -MultiViews'
              echo 'RewriteEngine On'
              echo 'RewriteBase /'
              echo 'RewriteRule ^index\.html$ - [L]'
              echo 'RewriteCond %{REQUEST_URI} !^/api'
              echo 'RewriteCond %{REQUEST_URI} !^/admin'
              echo 'RewriteCond %{REQUEST_URI} !^/filament'
              echo 'RewriteCond %{REQUEST_URI} !^/js/filament'
              echo 'RewriteCond %{REQUEST_URI} !^/css/filament'
              echo 'RewriteCond %{REQUEST_URI} !^/livewire'
              echo 'RewriteCond %{REQUEST_URI} !^/swagger'
              echo 'RewriteCond %{REQUEST_URI} !^/storage'
              echo 'RewriteCond %{REQUEST_URI} !^/fotos'
              echo 'RewriteCond %{REQUEST_URI} !^/libros'
              echo 'RewriteCond %{REQUEST_FILENAME} !-f'
              echo 'RewriteCond %{REQUEST_FILENAME} !-d'
              echo 'RewriteRule . /index.html [L]'
            } | sudo tee /var/www/html/.htaccess > /dev/null

            # ── Asegurar modulos Apache ───────────────────────────────────
            sudo a2enmod proxy proxy_http rewrite

            # ── Vhost HTTP: AllowOverride All ─────────────────────────────
            sudo sed -i "s|AllowOverride None|AllowOverride All|g" /etc/apache2/sites-available/000-default.conf

            # ── Eliminar regla ModSecurity conflictiva si existe ─────────
            # id:9002001 colisiona con REQUEST-903.9002-WORDPRESS-EXCLUSION-RULES.conf
            sudo rm -f /etc/modsecurity/99-rest-methods.conf

            # ── HTTPS con certbot ─────────────────────────────────────────
            if [ ! -d "/etc/letsencrypt/live/bookshell.duckdns.org" ]; then
              echo "==> Solicitando certificado HTTPS..."
              sudo certbot --apache \
                -d bookshell.duckdns.org \
                --non-interactive \
                --agree-tos \
                -m ${{ secrets.CERTBOT_EMAIL }} \
                --redirect
              echo "HTTPS activado"
            else
              echo "==> Renovando certificado si es necesario..."
              sudo certbot renew --quiet
            fi

            # ── Reescribir vhost SSL completo (todos los ProxyPass de una vez) ─
            SSL_VHOST="/etc/apache2/sites-available/000-default-le-ssl.conf"
            if [ -f "$SSL_VHOST" ]; then
              echo "==> Reescribiendo vhost SSL con todos los ProxyPass..."
              sudo tee "$SSL_VHOST" > /dev/null << APACHEEOF
            <IfModule mod_ssl.c>
            <VirtualHost *:443>
                ServerAdmin webmaster@localhost
                DocumentRoot /var/www/html

                <Directory /var/www/html>
                    AllowOverride All
                    Require all granted
                </Directory>

                ProxyPreserveHost On
                ProxyPass        /api          http://${BACKEND_IP}:80/api
                ProxyPassReverse /api          http://${BACKEND_IP}:80/api
                ProxyPass        /filament     http://${BACKEND_IP}:80/filament
                ProxyPassReverse /filament     http://${BACKEND_IP}:80/filament
                ProxyPass        /js/filament  http://${BACKEND_IP}:80/js/filament
                ProxyPassReverse /js/filament  http://${BACKEND_IP}:80/js/filament
                ProxyPass        /css/filament http://${BACKEND_IP}:80/css/filament
                ProxyPassReverse /css/filament http://${BACKEND_IP}:80/css/filament
                ProxyPass        /livewire     http://${BACKEND_IP}:80/livewire
                ProxyPassReverse /livewire     http://${BACKEND_IP}:80/livewire
                ProxyPass        /storage      http://${BACKEND_IP}:80/storage
                ProxyPassReverse /storage      http://${BACKEND_IP}:80/storage
                ProxyPass        /fotos        http://${BACKEND_IP}:80/fotos
                ProxyPassReverse /fotos        http://${BACKEND_IP}:80/fotos
                ProxyPass        /libros       http://${BACKEND_IP}:80/libros
                ProxyPassReverse /libros       http://${BACKEND_IP}:80/libros
                ProxyPass        /swagger      http://${BACKEND_IP}:80/swagger
                ProxyPassReverse /swagger      http://${BACKEND_IP}:80/swagger

                SSLCertificateFile    /etc/letsencrypt/live/bookshell.duckdns.org/fullchain.pem
                SSLCertificateKeyFile /etc/letsencrypt/live/bookshell.duckdns.org/privkey.pem
                Include /etc/letsencrypt/options-ssl-apache.conf
            </VirtualHost>
            </IfModule>
            APACHEEOF
              sudo a2ensite 000-default-le-ssl.conf 2>/dev/null || true
            fi

            # ── ModSecurity: permitir metodos REST (PUT, DELETE, PATCH) ─────
            if sudo a2query -m security2 2>/dev/null | grep -q enabled; then
              echo "==> Configurando ModSecurity para permitir metodos REST..."
              printf "SecAction \"id:1000001,phase:1,nolog,pass,t:none,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT DELETE PATCH'\"\n" \
                | sudo tee /etc/modsecurity/99-rest-methods.conf > /dev/null
            fi

            sudo apache2ctl configtest
            sudo systemctl reload apache2
            echo "Frontend desplegado — $(date)"
