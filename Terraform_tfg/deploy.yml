name: Deploy Backend (Laravel)

# Despliega el backend Laravel en la instancia EC2 Backend via SSH a traves del bastion.
# Secrets requeridos en GitHub:
#   BASTION_EIP         — IP publica del bastion (terraform output bastion_eip)
#   BACKEND_PRIVATE_IP  — IP privada del backend  (terraform output backend_private_ip)
#   SSH_PRIVATE_KEY     — Clave privada PEM del Key Pair de AWS (sin passphrase)

on:
  push:
    branches: [Back]
    paths:
      - 'backend.sh'
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Laravel via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      # SSH al backend a traves del bastion (ProxyJump)
      - name: Pull y desplegar en backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACKEND_PRIVATE_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_EIP }}
          proxy_username: ubuntu
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/back

            # Actualizar codigo
            sudo git pull origin Back

            # Dependencias y cache
            sudo composer install --no-dev --optimize-autoloader
            sudo php artisan migrate --force
            sudo php artisan config:cache
            sudo php artisan route:cache
            sudo php artisan view:cache

            # Permisos y recarga
            sudo chown -R www-data:www-data /var/www/back/storage
            sudo systemctl reload apache2

            echo "Backend desplegado correctamente — $(date)"
