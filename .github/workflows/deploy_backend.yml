name: Deploy Backend (Laravel)

# Despliega el backend Laravel en la instancia EC2 Backend via SSH a traves del bastion.
# Secrets requeridos en GitHub:
#   BASTION_EIP         — IP publica del bastion (terraform output bastion_eip)
#   BACKEND_PRIVATE_IP  — IP privada del backend  (terraform output backend_private_ip)
#   SSH_PRIVATE_KEY     — Clave privada PEM del Key Pair de AWS (sin passphrase)
#   RDS_ENDPOINT        — Endpoint del RDS MySQL   (terraform output rds_endpoint)
#   TF_VAR_DB_PASSWORD  — Contrasena de la base de datos RDS

on:
  push:
    branches: [Back]
    paths:
      - 'backend.sh'
      - 'backend/**'
      - '*.php'
      - 'composer.json'
      - 'routes/**'
      - 'app/**'
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Laravel via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Pull y desplegar en backend (via bastion)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACKEND_PRIVATE_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_EIP }}
          proxy_username: ubuntu
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # Clonar y configurar en la primera ejecucion si el directorio no existe
            if [ ! -d "/var/www/back/.git" ]; then
              echo "Directorio no encontrado, clonando repositorio..."
              sudo git clone -b Back --single-branch https://github.com/ftoledo-26/bookshell.git /var/www/back

              sudo cp /var/www/back/.env.example /var/www/back/.env
              sudo sed -i "s|DB_CONNECTION=.*|DB_CONNECTION=mysql|"           /var/www/back/.env
              sudo sed -i "s|DB_HOST=.*|DB_HOST=${{ secrets.RDS_ENDPOINT }}|" /var/www/back/.env
              sudo sed -i "s|DB_DATABASE=.*|DB_DATABASE=laravel|"             /var/www/back/.env
              sudo sed -i "s|DB_USERNAME=.*|DB_USERNAME=laravel|"             /var/www/back/.env
              sudo sed -i "s|DB_PASSWORD=.*|DB_PASSWORD=${{ secrets.TF_VAR_DB_PASSWORD }}|" /var/www/back/.env

              cd /var/www/back
              sudo composer install --no-dev --optimize-autoloader
              sudo php artisan key:generate --force
            else
              cd /var/www/back
              sudo git pull origin Back
              sudo composer install --no-dev --optimize-autoloader
            fi

            sudo php artisan migrate --force
            sudo php artisan config:cache
            sudo php artisan route:cache
            sudo php artisan view:cache
            sudo chown -R www-data:www-data /var/www/back/storage /var/www/back/bootstrap/cache
            sudo systemctl reload apache2

            echo "Backend desplegado — $(date)"
