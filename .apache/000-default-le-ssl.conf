<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName bookshell.duckdns.org
    DocumentRoot /var/www/back/public
    <Directory /var/www/back/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        <LimitExcept GET POST PUT DELETE PATCH HEAD OPTIONS>
            Require all denied
        </LimitExcept>
    </Directory>
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/bookshell.duckdns.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/bookshell.duckdns.org/privkey.pem
</VirtualHost>
</IfModule>
