name: Deploy Frontend (Angular)

# Despliega la aplicacion Angular en la instancia EC2 Frontend via SSH a traves del bastion.
# Tambien actualiza DuckDNS y activa HTTPS con certbot si aun no esta activado.
# Secrets requeridos en GitHub:
#   SSH_PRIVATE_KEY      — Clave privada PEM del Key Pair de AWS (sin passphrase)
#   DUCKDNS_TOKEN        — Token de DuckDNS (en duckdns.org -> tu cuenta)
#   CERTBOT_EMAIL        — Email para Let's Encrypt (p.ej. tu@gmail.com)
# Variables de repositorio (se rellenan automaticamente por terraform.yml):
#   BASTION_EIP, FRONTEND_PRIVATE_IP, FRONTEND_EIP, BACKEND_PRIVATE_IP

on:
  push:
    branches: [Front]
    paths:
      - 'frontend/src/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/angular.json'
      - 'Terraform_tfg/frontend.sh'
      - '.github/workflows/deploy_frontend.yml'
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Angular via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Actualizar DuckDNS
        continue-on-error: true
        run: |
          RESP=$(curl -s --max-time 15 "https://www.duckdns.org/update?domains=bookshell&token=${{ secrets.DUCKDNS_TOKEN }}&ip=${{ vars.FRONTEND_EIP }}" || echo "CURL_ERROR")
          echo "Respuesta DuckDNS: $RESP"
          if [ "$RESP" != "OK" ]; then
            echo "::warning::DuckDNS no devolvio OK — comprueba el token y la IP"
          fi

      - name: Pull, build y HTTPS (via bastion)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.FRONTEND_PRIVATE_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ vars.BASTION_EIP }}
          proxy_username: ubuntu
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e

            # ── Actualizar codigo (reset hard para limpiar conflictos locales) ──
            cd /var/www/front
            sudo git fetch origin Front
            sudo git reset --hard origin/Front

            # ── Build Angular (el proyecto esta en frontend/) ─────────────
            cd /var/www/front/frontend
            sudo npm ci
            sudo npm run build -- --configuration production

            # ── Copiar build al DocumentRoot ──────────────────────────────
            sudo rm -rf /var/www/html/*
            DIST_DIR=$(sudo find /var/www/front/frontend/dist -name "index.html" -exec dirname {} \; | head -1)
            sudo cp -r "$DIST_DIR"/* /var/www/html/

            # ── .htaccess para Angular routing (evita 404 al recargar) ────
            {
              echo 'Options -MultiViews'
              echo 'RewriteEngine On'
              echo 'RewriteBase /'
              echo 'RewriteRule ^index\.html$ - [L]'
              echo 'RewriteCond %{REQUEST_URI} !^/api'
              echo 'RewriteCond %{REQUEST_URI} !^/admin'
              echo 'RewriteCond %{REQUEST_URI} !^/filament'
              echo 'RewriteCond %{REQUEST_URI} !^/storage'
              echo 'RewriteCond %{REQUEST_URI} !^/fotos'
              echo 'RewriteCond %{REQUEST_FILENAME} !-f'
              echo 'RewriteCond %{REQUEST_FILENAME} !-d'
              echo 'RewriteRule . /index.html [L]'
            } | sudo tee /var/www/html/.htaccess > /dev/null

            # ── Asegurar modulos proxy activos ────────────────────────────
            sudo a2enmod proxy proxy_http rewrite

            # ── Corregir puerto proxy en vhost HTTP ───────────────────────
            sudo sed -i "s|:8000/api|:80/api|g" /etc/apache2/sites-available/000-default.conf
            # Asegurar AllowOverride All en vhost HTTP
            sudo sed -i "s|AllowOverride None|AllowOverride All|g" /etc/apache2/sites-available/000-default.conf

            # ── HTTPS con certbot ─────────────────────────────────────────
            if [ ! -d "/etc/letsencrypt/live/bookshell.duckdns.org" ]; then
              echo "==> Solicitando certificado HTTPS..."
              sudo certbot --apache \
                -d bookshell.duckdns.org \
                --non-interactive \
                --agree-tos \
                -m ${{ secrets.CERTBOT_EMAIL }} \
                --redirect
              echo "HTTPS activado"
            else
              echo "==> Renovando certificado si es necesario..."
              sudo certbot renew --quiet
            fi

            # ── Asegurar ProxyPass y AllowOverride en vhost SSL ───────────
            SSL_VHOST="/etc/apache2/sites-available/000-default-le-ssl.conf"
            if [ -f "$SSL_VHOST" ]; then
              sudo sed -i "s|:8000/api|:80/api|g" "$SSL_VHOST"
              # AllowOverride: reemplazar cualquier valor, o añadir si no existe
              if sudo grep -q "AllowOverride" "$SSL_VHOST"; then
                sudo sed -i "s|AllowOverride.*|AllowOverride All|g" "$SSL_VHOST"
              else
                sudo sed -i "s|</Directory>|    AllowOverride All\n</Directory>|" "$SSL_VHOST"
              fi
              BACKEND_IP="${{ vars.BACKEND_PRIVATE_IP }}"
              if ! sudo grep -q "ProxyPass /api" "$SSL_VHOST"; then
                echo "==> Aniadiendo ProxyPass /api al vhost SSL..."
                sudo sed -i "s|</VirtualHost>|    ProxyPreserveHost On\n    ProxyPass        /api http://${BACKEND_IP}:80/api\n    ProxyPassReverse /api http://${BACKEND_IP}:80/api\n</VirtualHost>|" "$SSL_VHOST"
              fi
              if ! sudo grep -q "ProxyPass /filament" "$SSL_VHOST"; then
                echo "==> Aniadiendo ProxyPass /filament al vhost SSL..."
                sudo sed -i "s|</VirtualHost>|    ProxyPass        /filament http://${BACKEND_IP}:80/filament\n    ProxyPassReverse /filament http://${BACKEND_IP}:80/filament\n</VirtualHost>|" "$SSL_VHOST"
              fi
              if ! sudo grep -q "ProxyPass /storage" "$SSL_VHOST"; then
                echo "==> Aniadiendo ProxyPass /storage al vhost SSL..."
                sudo sed -i "s|</VirtualHost>|    ProxyPass        /storage http://${BACKEND_IP}:80/storage\n    ProxyPassReverse /storage http://${BACKEND_IP}:80/storage\n</VirtualHost>|" "$SSL_VHOST"
              fi
              if ! sudo grep -q "ProxyPass /js/filament" "$SSL_VHOST"; then
                echo "==> Aniadiendo ProxyPass /js/filament al vhost SSL..."
                sudo sed -i "s|</VirtualHost>|    ProxyPass        /js/filament http://${BACKEND_IP}:80/js/filament\n    ProxyPassReverse /js/filament http://${BACKEND_IP}:80/js/filament\n</VirtualHost>|" "$SSL_VHOST"
              fi
              if ! sudo grep -q "ProxyPass /css/filament" "$SSL_VHOST"; then
                echo "==> Aniadiendo ProxyPass /css/filament al vhost SSL..."
                sudo sed -i "s|</VirtualHost>|    ProxyPass        /css/filament http://${BACKEND_IP}:80/css/filament\n    ProxyPassReverse /css/filament http://${BACKEND_IP}:80/css/filament\n</VirtualHost>|" "$SSL_VHOST"
              fi
              if ! sudo grep -q "ProxyPass /livewire" "$SSL_VHOST"; then
                echo "==> Aniadiendo ProxyPass /livewire al vhost SSL..."
                sudo sed -i "s|</VirtualHost>|    ProxyPass        /livewire http://${BACKEND_IP}:80/livewire\n    ProxyPassReverse /livewire http://${BACKEND_IP}:80/livewire\n</VirtualHost>|" "$SSL_VHOST"
              fi
              if ! sudo grep -q "ProxyPass /fotos" "$SSL_VHOST"; then
                echo "==> Aniadiendo ProxyPass /fotos al vhost SSL..."
                sudo sed -i "s|</VirtualHost>|    ProxyPass        /fotos http://${BACKEND_IP}:80/fotos\n    ProxyPassReverse /fotos http://${BACKEND_IP}:80/fotos\n</VirtualHost>|" "$SSL_VHOST"
              fi
              if ! sudo grep -q "ProxyPass /libros" "$SSL_VHOST"; then
                echo "==> Aniadiendo ProxyPass /libros al vhost SSL..."
                sudo sed -i "s|</VirtualHost>|    ProxyPass        /libros http://${BACKEND_IP}:80/libros\n    ProxyPassReverse /libros http://${BACKEND_IP}:80/libros\n</VirtualHost>|" "$SSL_VHOST"
              fi
            fi

            sudo systemctl reload apache2
            echo "Frontend desplegado — $(date)"
