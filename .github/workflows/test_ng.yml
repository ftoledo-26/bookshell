name: Angular Tests
on:
  push:
    branches: [main, Front]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx ng test --watch=false --browsers=ChromeHeadless
