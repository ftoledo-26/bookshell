name: Deploy Frontend (Angular)

# Despliega la aplicacion Angular en la instancia EC2 Frontend via SSH a traves del bastion.
# Tambien actualiza DuckDNS y activa HTTPS con certbot si aun no esta activado.
# Secrets requeridos en GitHub:
#   BASTION_EIP          — IP publica del bastion (terraform output bastion_eip)
#   FRONTEND_PRIVATE_IP  — IP privada del frontend (terraform output frontend_private_ip)
#   FRONTEND_EIP         — IP publica del frontend (terraform output frontend_eip)
#   SSH_PRIVATE_KEY      — Clave privada PEM del Key Pair de AWS (sin passphrase)
#   DUCKDNS_TOKEN        — Token de DuckDNS (en duckdns.org -> tu cuenta)
#   CERTBOT_EMAIL        — Email para Let's Encrypt (p.ej. tu@gmail.com)

on:
  push:
    branches: [Front]
    paths:
      - 'frontend.sh'
      - 'frontend/**'
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Angular via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      # Actualizar DuckDNS con la IP actual del frontend
      - name: Actualizar DuckDNS
        run: |
          RESP=$(curl -s "https://www.duckdns.org/update?domains=bookshell&token=${{ secrets.DUCKDNS_TOKEN }}&ip=${{ secrets.FRONTEND_EIP }}")
          echo "Respuesta DuckDNS: $RESP"
          if [ "$RESP" != "OK" ]; then
            echo "Advertencia: DuckDNS no devolvio OK"
          fi

      # Pull, build Angular y recarga Apache en el servidor frontend
      - name: Pull, build y desplegar Angular (via bastion)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FRONTEND_PRIVATE_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_EIP }}
          proxy_username: ubuntu
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/front

            sudo git pull origin Front
            sudo npm ci
            sudo npm run build -- --configuration production

            sudo rm -rf /var/www/html/*
            DIST_DIR=$(find /var/www/front/dist -name "index.html" -exec dirname {} \; | head -1)
            sudo cp -r $DIST_DIR/* /var/www/html/

            sudo systemctl reload apache2
            echo "Frontend Angular desplegado — $(date)"

      # Activar HTTPS con certbot (solo si aun no esta configurado)
      - name: Activar HTTPS con certbot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FRONTEND_PRIVATE_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_EIP }}
          proxy_username: ubuntu
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Solo ejecuta certbot si aun no existe el certificado
            if [ ! -d "/etc/letsencrypt/live/bookshell.duckdns.org" ]; then
              echo "Solicitando certificado Let's Encrypt..."
              sudo certbot --apache \
                -d bookshell.duckdns.org \
                --non-interactive \
                --agree-tos \
                -m ${{ secrets.CERTBOT_EMAIL }} \
                --redirect
              echo "HTTPS activado correctamente"
            else
              echo "Certificado ya existe, renovando si es necesario..."
              sudo certbot renew --quiet
            fi
